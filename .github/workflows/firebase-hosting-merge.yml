name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Nomes tipados x arquivos em public/icons — falha antes do build.
      - run: npm run icones:verificar
      # Entre outras regras, barra SVG solto fora do componente Icone.
      - run: npm run lint
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRAATICO_C2880 }}
          channelId: live
          projectId: praatico-c2880
          target: praatico